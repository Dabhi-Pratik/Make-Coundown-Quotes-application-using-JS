<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Coundown & Quotes application using JS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Quotes slider card -->
    <div class="slider">
        <span class="quote-icon">❝</span>
        <p id="Quotes">“Arise, awake, and stop not till the goal is reached.”</p>
        <p id="Author">— Swami Vivekananda</p>
    </div>

    <!-- Navigation buttons -->
    <div class="btn-group">
        <button onclick="prevClick()">Prev</button>
        <button onclick="nextClick()">Next</button>
    </div>

    <!-- External JavaScript -->
    <script src="./script.js"></script>
</body>

</html>
